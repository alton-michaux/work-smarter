name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: backend.settings
      SECRET_KEY: ci-secret-key
      DEBUG: "0"
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create network
        run: docker network create ci-net

      - name: Start Postgres
        run: |
          docker run -d --name postgres --network ci-net \
            -e POSTGRES_DB="${POSTGRES_DB}" \
            -e POSTGRES_USER="${POSTGRES_USER}" \
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            postgres:13

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker exec postgres pg_isready -U "${POSTGRES_USER}" && exit 0
            sleep 1
          done
          echo "Postgres did not become ready in time" && exit 1

      - name: Run backend tests
        run: |
          docker run --rm --network ci-net \
            -e DJANGO_SETTINGS_MODULE="${DJANGO_SETTINGS_MODULE}" \
            -e DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e DEBUG="${DEBUG}" \
            backend-ci:latest \
            bash -lc "python -m pytest -q"

      - name: Check for missing migrations
        run: |
          docker run --rm --network ci-net \
            -e DJANGO_SETTINGS_MODULE="${DJANGO_SETTINGS_MODULE}" \
            -e DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e DEBUG="${DEBUG}" \
            backend-ci:latest \
            bash -lc "python manage.py makemigrations --check --dry-run"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f postgres || true
          docker network rm ci-net || true

