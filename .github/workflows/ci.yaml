name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (Django) tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Adjust these to match your Django settings expectations.
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test_db
      SECRET_KEY: ci-secret-key
      DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If your backend runs tests via Docker (recommended since you're dockerized),
      # this keeps CI identical to how you run locally/production.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run backend tests (pytest or Django test runner)
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE="${DJANGO_SETTINGS_MODULE}" \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e DEBUG="${DEBUG}" \
            backend-ci:latest \
            bash -lc "python -m pytest -q"

      # Optional but highly recommended: ensure migrations are in sync
      - name: Check for missing migrations
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE="${DJANGO_SETTINGS_MODULE}" \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e DEBUG="${DEBUG}" \
            backend-ci:latest \
            bash -lc "python manage.py makemigrations --check --dry-run"

