<svg width="300" height="280" viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Work Smarter logo">
  <title>Work Smarter</title>

  <!-- Node cluster -->
  <g transform="translate(150, 110)">
    <!-- Outer ring nodes -->
    <circle cx="0" cy="-56" r="6" fill="#B5D4F4"/>
    <circle cx="48" cy="-28" r="6" fill="#B5D4F4"/>
    <circle cx="48" cy="28" r="6" fill="#B5D4F4"/>
    <circle cx="0" cy="56" r="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
    <circle cx="-48" cy="28" r="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
    <circle cx="-48" cy="-28" r="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
    <!-- Outer connectors -->
    <line x1="0" y1="-50" x2="0" y2="-18" stroke="#B5D4F4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="43" y1="-25" x2="14" y2="-8" stroke="#B5D4F4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="43" y1="25" x2="14" y2="8" stroke="#B5D4F4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="0" y2="18" stroke="#B5D4F4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-43" y1="25" x2="-14" y2="8" stroke="#B5D4F4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-43" y1="-25" x2="-14" y2="-8" stroke="#B5D4F4" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Inner ring nodes -->
    <circle cx="0" cy="-18" r="8" fill="#378ADD"/>
    <circle cx="16" cy="10" r="8" fill="#378ADD"/>
    <circle cx="-16" cy="10" r="8" fill="#378ADD"/>
    <!-- Inner connectors -->
    <line x1="0" y1="-10" x2="12" y2="4" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="-12" y2="4" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="-12" y2="14" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Central node -->
    <circle cx="0" cy="0" r="12" fill="#185FA5"/>
    <circle cx="0" cy="0" r="5" fill="white"/>
    <!-- Active highlights -->
    <circle cx="0" cy="-56" r="3" fill="#185FA5"/>
    <circle cx="48" cy="-28" r="3" fill="#185FA5"/>
  </g>

  <!-- Data pulse -->
  <g transform="translate(150, 196)">
    <line x1="-52" y1="0" x2="-30" y2="0" stroke="#B5D4F4" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="-30,0 -20,-16 -10,0 -2,-10 6,0 16,14 26,0" fill="none" stroke="#378ADD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="0" x2="52" y2="0" stroke="#B5D4F4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="0.18em" fill="#378ADD">WORK</text>
  <text x="150" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" letter-spacing="0.02em" fill="#0C447C">smarter</text>

  <!-- Tagline -->
  <text x="150" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.06em" fill="#378ADD">AI-powered productivity</text>
</svg>
