services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:18
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so mount
      # the parent. New volume name: the old `dbdata` volume holds 13-format data
      # that 18 cannot open; it is left in place untouched.
      - dbdata18:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

networks:
  default:
    driver: bridge

volumes:
  dbdata18:
